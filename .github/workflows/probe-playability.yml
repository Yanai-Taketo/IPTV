name: Probe stream playability

# 全ストリームの再生可能性インデックス (data/playability.json) を毎日更新する。
# schedule はデフォルトブランチ上のワークフローのみ実行される点に注意。
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  # プローブ処理自体が変わったとき(および main への初回導入時)にも実行する
  push:
    branches: [main]
    paths:
      - 'scripts/probe-streams.mjs'
      - '.github/workflows/probe-playability.yml'

permissions:
  contents: write

concurrency:
  group: probe-playability
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Probe all streams
        run: node scripts/probe-streams.mjs --out data/playability.json

      - name: Commit updated index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/playability.json
          if git diff --staged --quiet; then
            echo "no changes"
          else
            git commit -m "Update stream playability index"
            git push
          fi

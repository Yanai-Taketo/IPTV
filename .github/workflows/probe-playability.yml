name: Probe stream playability

# 全ストリームの再生可能性インデックス (data/playability.json) を毎日更新する。
# schedule はデフォルトブランチ上のワークフローのみ実行される点に注意。
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      fail_drop:
        description: '再生可能率がこの比率を超えて落ちたら中断(0 < r < 1)。上流の実変動で止まったときの手動突破用'
        default: '0.5'
  # プローブ処理自体が変わったとき(および main への初回導入時)にも実行する
  push:
    branches: [main]
    paths:
      - 'scripts/probe-streams.mjs'
      - 'scripts/compare-playability.mjs'
      - 'scripts/playability-report.mjs'
      - '.github/workflows/probe-playability.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: probe-playability
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # プローブは data/playability.json を上書きするため、比較用に
      # 前回コミットされたインデックスを先に退避しておく
      - name: Snapshot previous index
        run: |
          if [ -f data/playability.json ]; then
            cp data/playability.json "$RUNNER_TEMP/playability-prev.json"
          else
            echo "no previous index (first run)"
          fi

      - name: Probe all streams
        run: node scripts/probe-streams.mjs --out data/playability.json

      # 前回比をジョブサマリに出し、再生可能率が急落したらここで止める。
      # 2026-08-04 に playable 5,846 → 751(-87%)の壊れたインデックスが
      # そのままコミット・デプロイされた実績があるため、コミット前に判定する
      # (中断すればサイトは前日のインデックスのまま = 壊れた配信をしない)
      - name: Report change vs previous run
        env:
          FAIL_DROP: ${{ github.event.inputs.fail_drop || '0.5' }}
        run: |
          node scripts/compare-playability.mjs \
            --prev "$RUNNER_TEMP/playability-prev.json" \
            --next data/playability.json \
            --summary "$GITHUB_STEP_SUMMARY" \
            --fail-drop "$FAIL_DROP"

      - name: Commit updated index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/playability.json
          if git diff --staged --quiet; then
            echo "no changes"
          else
            git commit -m "Update stream playability index"
            # プローブ実行中(最長 30 分)に main が進んでいても失敗しないよう
            # 取り込みつつプッシュする
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push
          fi

      # 番組表データは履歴肥大を避けるため epg-data ブランチにある
      # (grab-epg.yml 参照)。サイトに同梱するためデプロイ直前に取り出す
      - name: Include latest EPG data
        run: |
          if git fetch --depth 1 origin epg-data; then
            git checkout FETCH_HEAD -- data/epg
          else
            echo "no epg-data branch yet"
          fi

      # GITHUB_TOKEN によるコミットは他のワークフローを起動しないため、
      # インデックス更新をサイトに反映するデプロイはここで行う
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

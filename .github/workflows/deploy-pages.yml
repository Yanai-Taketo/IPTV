name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 番組表データは履歴肥大を避けるため epg-data ブランチにある
      # (grab-epg.yml 参照)。サイトに同梱するためデプロイ直前に取り出す
      - name: Include latest EPG data
        run: |
          if git fetch --depth 1 origin epg-data; then
            git checkout FETCH_HEAD -- data/epg
          else
            echo "no epg-data branch yet"
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # Pages が未有効の場合はこのステップが自動で有効化する
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          # ビルド不要の静的サイトなのでリポジトリ全体をそのまま配信する
          path: '.'

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
